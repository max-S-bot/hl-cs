<!DOCTYPE html>

<html>
    <head>
        <title>Search/Sort Master</title>
        <style>body{background-color:rgb(0,255,128);text-align:center;}</style>
    </head>

    <body>
        <h2>Welcome to Search/Sort Master!</h2>
        <hr>
        <h3>Sequential Search</h3>
        <button id="seqButton">Sequential Search</button>
        <div id="output_sequential"></div>
        <hr>
        <h3>Binary Search Game</h3>
        <input id="guess">
        <button id="binButton">Binary Search GUESS</button>
        <div>Number of gueses: </div>
        <br>
        <div id="num_guesses">0</div>
        <br>
        <div id="output_binary"></div>
        <br>
        <div id="answer">Keep guessing</div>
        <hr>
        <h3>Bubble and Selection Sort</h3>
        <button id="testButton">Test Sort Algos</button>
        <div id="output_bubble"></div>
        <br>
        <div id="output_selection"></div>
        <script src="script.js"></script>
    </body>
</html>
